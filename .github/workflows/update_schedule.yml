name: Update TV Schedule Daily

on:
  schedule:
    # מוגדר לרוץ כל יום ב-6:00 בבוקר שעון UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # מאפשר הרצה ידנית מתוך GitHub מתי שתרצה

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 curl_cffi

      - name: Run Scraper
        run: |
          cd scraper
          python scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add grandma_tv_app/assets/tv_guide.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TV guide JSON" && git push)